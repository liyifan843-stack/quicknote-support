<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>QuickNote for Mac 支持</title>
  <style>
    :root { color-scheme: light; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    body { margin: 0; background: #fff8ee; color: #2b2117; }
    main { max-width: 880px; margin: 0 auto; padding: 56px 24px; }
    .hero { background: linear-gradient(135deg, #ffe7a8, #f7b34f); border-radius: 26px; padding: 42px; }
    h1 { margin: 0 0 12px; font-size: 42px; }
    .muted { color: #6d5842; }
    .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(230px, 1fr)); gap: 16px; margin-top: 24px; }
    .card { background: white; border-radius: 18px; padding: 22px; box-shadow: 0 10px 30px #8b5a2318; }
    a { color: #b7640e; }
    footer { margin: 30px 0; color: #7b6854; }
  </style>
</head>
<body>
  <main>
    <section class="hero">
      <div>QuickNote for Mac</div>
      <h1>先记下来，再慢慢整理。</h1>
      <p class="muted">一款快速、专注、完全在本机保存的 macOS 笔记工具。</p>
    </section>
    <section class="grid">
      <article class="card"><h2>快速捕获</h2><p>通过菜单栏立即记录想法，不需要切换工作窗口。</p></article>
      <article class="card"><h2>清晰整理</h2><p>使用标签、颜色和置顶功能，把重要内容放在容易找到的位置。</p></article>
      <article class="card"><h2>本地隐私</h2><p>不需要账号，不包含分析、广告或追踪 SDK。</p></article>
    </section>
    <footer>© 2026 QuickNote · <a href="privacy.html">隐私政策</a> · <a href="support.html">帮助中心</a></footer>
  </main>
</body>
</html>
