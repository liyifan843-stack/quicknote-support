  <h1>QuickNote 隐私政策</h1>
  <p>生效日期：2026-11-13</p>
  <p>QuickNote 不收集、不上传、不销售、不共享个人信息。应用不需要账号，不包含分析 SDK、广告 SDK、追踪 SDK 或第三方登录。</p>
  <h2>笔记内容</h2>
  <p>你创建的笔记标题、正文、标签和颜色标记只保存在本机应用沙盒内。应用不读取其他文件，也不会把笔记发送到服务器。</p>
  <h2>网络</h2>
  <p>核心功能不需要网络连接。应用不会主动连接服务器，也不会发送使用数据或崩溃数据。</p>
  <h2>联系</h2>
  <p>如对隐私政策有疑问，请通过帮助中心联系开发者。</p>
