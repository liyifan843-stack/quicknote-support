  <h1>QuickNote 帮助中心</h1>
  <h2>如何创建笔记？</h2>
  <p>点击左下角的 New Note，或使用 Command-N。输入标题和正文后，内容会自动保存。</p>
  <h2>如何快速记录想法？</h2>
  <p>点击菜单栏中的 QuickNote 图标，在 Quick capture 输入框中输入内容并按 Return。</p>
  <h2>如何查找笔记？</h2>
  <p>在搜索框输入标题、正文或标签关键词。也可以在侧边栏选择标签进行筛选。</p>
  <h2>我的笔记会上传吗？</h2>
  <p>不会。所有笔记都保存在本机应用沙盒内，应用不包含账号、分析、广告或追踪功能。</p>
  <h2>联系方式</h2>
  <p>请通过 <a href="https://github.com/liyifan843-stack/quicknote-support/issues">GitHub Issues</a> 联系开发者。</p>
